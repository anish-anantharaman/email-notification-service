<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Email Card</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #808080;
                margin: 0;
                padding: 20px;
            }

            .card-container {
                max-width: 600px;
                margin: auto;
            }

            .card {
                background-color: #fff;
                border-radius: 10px;
                overflow: hidden;
                border: 1px solid #d1d5db;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15),
                0 2px 6px rgba(0, 0, 0, 0.1);
            }

            .card img {
                width: 100%;
                height: auto;
            }

            .card-content {
                padding: 20px;
                color: #333;
            }

            .salutation {
                margin-bottom: 15px;
            }
        </style>
    </head>

    <body>
        <div class="card-container">
            <div class="card">

                <!-- Top Image -->
                <img th:src="${imageUrl}" alt="Header Image"/>

                <!-- Content -->
                <div class="card-content">
                    <p class="salutation">
                        <span th:text="'Dear ' + ${name} + ','"> Dear User,</span>
                    </p>
                    <p class="message" th:text="${message}">
                        This is the main message content.
                    </p>
                    <p class="closing">
                        Thank you, <br/>
                        <span th:text="${senderName}">Your Company</span>
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>&copy; <span th:text="${year}">2026</span> All rights reserved.</p>
            </div>
        </div>
    </body>
</html>
